name: example build
run-name: "${{ inputs.cmake_re_commit_sha && format('example build - triggered by cmake-re ({0})', inputs.cmake_re_commit_sha) || github.event.pull_request.title || 'example build' }}"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Docker image to use (e.g. tipibuild/tipi-ubuntu:abc123)'
        required: false
        type: string
      cmake_re_commit_sha:
        description: 'cmake-re commit SHA'
        required: false
        type: string
      callback_repo:
        description: 'Repo (owner/repo) to post the resulting commit status to'
        required: false
        type: string
      callback_sha:
        description: 'Commit SHA to attach the resulting status to'
        required: false
        type: string
      callback_context:
        description: 'Commit status context, e.g. hfc/example'
        required: false
        type: string

permissions:
  contents: read

env:
  TIPI_ACCESS_TOKEN: ${{ secrets.HFC_TIPI_TEST_USER_TIPI_ACCESS_TOKEN }}
  TIPI_REFRESH_TOKEN: ${{ secrets.HFC_TIPI_TEST_USER_TIPI_REFRESH_TOKEN }}
  TIPI_VAULT_PASSPHRASE: ${{ secrets.HFC_TIPI_TEST_USER_TIPI_VAULT_PASSPHRASE }}
  TIPI_CACHE_CONSUME_ONLY: ON
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  # Consumed by the build-example composite action for distributed (RBE) builds.
  # Composite actions can't read the secrets context, so they're exposed here.
  RBE_service: ${{ secrets.EF_CLUSTER_RBE_SERVICE }}
  EF_CERT: ${{ secrets.EF_CLUSTER_CERT }}
  EF_KEY: ${{ secrets.EF_CLUSTER_KEY }}


jobs:
  build-example-boost-cmake-re:
    name: build example boost with cmake-re
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: boost
          mode: cmake-re

  # Skipped when triggered externally (if: !inputs.docker_image), but image is still
  # parametrized so that removing the 'if' guard doesn't silently run with the wrong image.
  build-example-boost-cmake:
    name: build example boost with cmake
    if: ${{ !inputs.docker_image }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: boost
          mode: cmake

  build-example-get-started-cmake-re:
    name: build example get-started with cmake-re
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: get-started
          mode: cmake-re

  build-example-get-started-cmake:
    name: build example get-started with cmake
    if: ${{ !inputs.docker_image }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: get-started
          mode: cmake

  build-example-with-grpc-cmake-re:
    name: build example grpc_use_3rd_party_cmake_modules with cmake-re
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: grpc_use_3rd_party_cmake_modules
          mode: cmake-re

  build-example-with-grpc-cmake:
    name: build example grpc_use_3rd_party_cmake_modules with cmake
    if: ${{ !inputs.docker_image }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: grpc_use_3rd_party_cmake_modules
          mode: cmake

  build-example-with-openssl-cmake-re:
    name: build example openssl with cmake-re
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: openssl
          mode: cmake-re

  build-example-with-openssl-cmake:
    name: build example openssl with cmake
    if: ${{ !inputs.docker_image }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: openssl
          mode: cmake

  build-example-with-arrow-cmake-re:
    name: build example arrow with cmake-re
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: arrow
          mode: cmake-re

  build-example-with-arrow-cmake:
    name: build example arrow with cmake
    if: ${{ !inputs.docker_image }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: arrow
          mode: cmake

  build-example-boost-distributed:
    name: build example boost with cmake-re --distributed
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: boost
          mode: distributed

  build-example-get-started-distributed:
    name: build example get-started with cmake-re --distributed
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: get-started
          mode: distributed

  build-example-with-grpc-distributed:
    name: build example grpc_use_3rd_party_cmake_modules with cmake-re --distributed
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: grpc_use_3rd_party_cmake_modules
          mode: distributed

  build-example-with-openssl-distributed:
    name: build example openssl with cmake-re --distributed
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: openssl
          mode: distributed

  build-example-with-arrow-distributed:
    name: build example arrow with cmake-re --distributed
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 90
    container:
      image: ${{ inputs.docker_image || 'tipibuild/tipi-ubuntu:latest' }}
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: checkout pull request
        uses: actions/checkout@v5
        with:
          path: './hfc_project'
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./hfc_project/.github/actions/build-example
        with:
          example: arrow
          mode: distributed

  # Reports this workflow's result back onto the cmake-re commit that dispatched
  # it. Runs on always() so a failed/cancelled/timed-out build still resolves the
  # 'pending' status the cmake-re side posted (otherwise its required check hangs).
  # Only depends on the cmake-re example jobs, since the cmake-only jobs are
  # skipped on external dispatch. No-op for pull_request runs, where the callback
  # inputs are absent.
  report-status:
    name: Report status to cmake-re
    needs:
      - build-example-boost-cmake-re
      - build-example-get-started-cmake-re
      - build-example-with-grpc-cmake-re
      - build-example-with-openssl-cmake-re
      - build-example-with-arrow-cmake-re
      - build-example-boost-distributed
      - build-example-get-started-distributed
      - build-example-with-grpc-distributed
      - build-example-with-openssl-distributed
      - build-example-with-arrow-distributed
    if: ${{ always() && inputs.callback_repo != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post commit status
        env:
          GH_TOKEN: ${{ secrets.CMAKE_RE_STATUS_TOKEN }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          STATE=success
          DESC="HFC example.yml passed"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              STATE=failure
              DESC="HFC example.yml failed (job result: $r)"
              break
            fi
          done
          gh api -X POST "repos/${{ inputs.callback_repo }}/statuses/${{ inputs.callback_sha }}" \
            -f state="$STATE" \
            -f context="${{ inputs.callback_context }}" \
            -f description="$DESC" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
